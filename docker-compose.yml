services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/finpilot.db
      SEED_ON_START: "1"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - finpilot-data:/data
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  finpilot-data:
